name: Salud diaria

# Cada mañana manda a Telegram un semáforo de las tres cadenas de publicación (bolsa, Planet in Numbers y ZERO):
# token de Instagram de este repo, escenarios y webhooks de Make, GitHub Pages y ejecuciones fallidas en 24 h.
# Solo lee: no genera ni publica nada. La lógica está en zero-understands/.github/workflows/health.yml.
on:
  schedule:
    # 07:45 Madrid: 07:15 is 05:15 UTC in summer (CEST) and 06:15 UTC in winter (CET). The "hora" job keeps
    # only the run of the right time zone and waits until 07:45 sharp (GitHub's cron often starts late).
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
    steps:
      - id: w
        run: |
          [ "${{ github.event_name }}" = schedule ] || { echo go=true >> "$GITHUB_OUTPUT"; exit 0; }
          NOW=$(date +%s); T=$(TZ=Europe/Madrid date -d 'today 07:45' +%s); M=$(TZ=Europe/Madrid date +%H%M)
          if [ "$M" -lt 0700 ] || [ "$M" -ge 0805 ]; then echo "::notice::Madrid $M: el cron del otro horario, nada que hacer"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$NOW" -lt "$T" ] && sleep $((T - NOW))
          echo go=true >> "$GITHUB_OUTPUT"

  salud:
    needs: hora
    if: needs.hora.outputs.go == 'true'
    uses: tuamigodelasfinanzas/zero-understands/.github/workflows/health.yml@main
    with:
      label: Resumen Bolsa + Make + Pages
      ig_check: true
      ig_user: "17841438528056370"
      make_check: true
      pages_urls: >-
        https://tuamigodelasfinanzas.github.io/resumen-bolsa-reel/
        https://tuamigodelasfinanzas.github.io/planet-in-numbers/state/used.json
        https://tuamigodelasfinanzas.github.io/zero-understands/state/rendered.json
      runs_repos: >-
        tuamigodelasfinanzas/resumen-bolsa-reel
        tuamigodelasfinanzas/planet-in-numbers
        tuamigodelasfinanzas/zero-understands
    secrets:
      IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
